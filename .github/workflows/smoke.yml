name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (Python ${{ matrix.python-version }}; ${{ matrix.profile }})
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            profile: "base; MCP tests skipped"
            mcp: false
          - python-version: "3.13"
            profile: MCP SDK enabled
            mcp: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.mcp == false
        run: python -m pip install "Pillow>=11,<12" "jsonschema>=4,<5"
      - if: matrix.mcp == true
        run: python -m pip install -r skills/seer/scripts/requirements-mcp.txt
      - run: for script in skills/seer/scripts/*.sh; do bash -n "$script"; done
      - run: |
          mkdir -p .local
          xcrun swiftc skills/seer/scripts/seer_native.swift -o .local/seer-native
          .local/seer-native --help
      - run: python -m unittest discover -s tests -v
      - run: python skills/seer/scripts/test_excalidraw.py
