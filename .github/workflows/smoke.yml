name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -m venv .local/venv
          .local/venv/bin/python -m pip install pillow
          echo "$PWD/.local/venv/bin" >> "$GITHUB_PATH"
      - run: for script in skills/seer/scripts/*.sh; do bash -n "$script"; done
      - run: |
          xcrun swiftc skills/seer/scripts/seer_native.swift -o .local/seer-native
          .local/seer-native --help
      - run: .local/venv/bin/python -m unittest discover -s tests -v
      - run: python3 skills/seer/scripts/test_excalidraw.py
